# ROS 2 type hashes advertised in the DDS USER_DATA QoS ("typehash=<hash>;") of the rviz_interface
# writers, as rmw_fastrtps_cpp does. Without them the zenoh bridge routes /tf and /joint_states
# with no hash and rmw_zenoh subscribers (e.g. foxglove_bridge) never receive them (no odom frame).
# Keys are ROS type names; empty or missing: no hash advertised. Values for ROS 2 Jazzy, from
# /opt/ros/jazzy/share/<package>/msg/<Type>.json
type_hashes:
  tf2_msgs/msg/TFMessage: "RIHS01_e369d0f05a23ae52508854b66f6aa0437f3449d652e8cbf22d5abe85d020f087"
  sensor_msgs/msg/JointState: "RIHS01_a13ee3a330e346c9d87b5aa18d24e11690752bd33a0350f11c5882bc9179260e"
